apiVersion: apps/v1
kind: Deployment
metadata:
  name: wpn-wordpress
  labels:
    app: wpn-wordpress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wpn-wordpress
  template:
    metadata:
      labels:
        app: wpn-wordpress
    spec:
      containers:
      - name: php-fpm
        image: wordpress:6-fpm
        ports:
        - containerPort: 9000
        env:
        - name: WORDPRESS_DB_HOST
          value: wpn-mysql
        - name: WORDPRESS_DB_NAME
          value: wordpress
        - name: WORDPRESS_DB_USER
          value: wpuser
        - name: WORDPRESS_DB_PASSWORD
          valueFrom:
            secretKeyRef: {name: wpn-mysql-secret, key: password}
        - name: WORDPRESS_AUTH_KEY
          valueFrom:
            secretKeyRef: {name: wpn-salts, key: AUTH_KEY}
        - name: WORDPRESS_SECURE_AUTH_KEY
          valueFrom:
            secretKeyRef: {name: wpn-salts, key: SECURE_AUTH_KEY}
        - name: WORDPRESS_LOGGED_IN_KEY
          valueFrom:
            secretKeyRef: {name: wpn-salts, key: LOGGED_IN_KEY}
        - name: WORDPRESS_NONCE_KEY
          valueFrom:
            secretKeyRef: {name: wpn-salts, key: NONCE_KEY}
        - name: WORDPRESS_AUTH_SALT
          valueFrom:
            secretKeyRef: {name: wpn-salts, key: AUTH_SALT}
        - name: WORDPRESS_SECURE_AUTH_SALT
          valueFrom:
            secretKeyRef: {name: wpn-salts, key: SECURE_AUTH_SALT}
        - name: WORDPRESS_LOGGED_IN_SALT
          valueFrom:
            secretKeyRef: {name: wpn-salts, key: LOGGED_IN_SALT}
        - name: WORDPRESS_NONCE_SALT
          valueFrom:
            secretKeyRef: {name: wpn-salts, key: NONCE_SALT}
        readinessProbe:
          tcpSocket:
            port: 9000
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 12
        volumeMounts:
        - name: wp-data
          mountPath: /var/www/html
      - name: nginx
        image: nginx:1.25
        ports:
        - containerPort: 80
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - name: wp-data
          mountPath: /var/www/html
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d
      volumes:
      - name: wp-data
        persistentVolumeClaim:
          claimName: wpn-wp-pvc
      - name: nginx-conf
        configMap:
          name: wpn-nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: wpn-wordpress-service
spec:
  type: NodePort
  selector:
    app: wpn-wordpress
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30010
